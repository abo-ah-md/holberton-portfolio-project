openapi: 3.0.0
info:
  title: Campus Book Exchange API
  version: 1.0.0
  description: >
    Internal REST API for a used-books marketplace: authentication, users,
    book listings, messaging, orders, and student verification.
servers:
  - url: https://api.example.com
    description: Production server
  - url: https://api.staging.example.com
    description: Staging server

tags:
  - name: Auth
  - name: Users
  - name: Books
  - name: Orders
  - name: Verification

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        campus:
          type: string
        degree:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Book:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        title:
          type: string
        author:
          type: string
        description:
          type: string
        condition:
          type: string
          enum: [new, like_new, good, acceptable]
        price:
          type: number
          format: float
        currency:
          type: string
          example: SAR
        campus:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum: [active, reserved, sold]
        createdAt:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        buyerId:
          type: string
        sellerId:
          type: string
        totalAmount:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, cancelled, completed]
        paymentProviderId:
          type: string
          description: Id from external payment gateway
        createdAt:
          type: string
          format: date-time

    VerificationRequest:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: string

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, campus]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                fullName:
                  type: string
                campus:
                  type: string
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    patch:
      tags: [Users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                campus:
                  type: string
                degree:
                  type: string
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /books:
    get:
      tags: [Books]
      summary: List book listings
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search term (title/author)
        - in: query
          name: campus
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags: [Books]
      summary: Create a new book listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author, price, condition]
              properties:
                title:
                  type: string
                author:
                  type: string
                description:
                  type: string
                condition:
                  type: string
                price:
                  type: number
                currency:
                  type: string
                campus:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        '201':
          description: Created book listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /books/{id}:
    get:
      tags: [Books]
      summary: Get a single book listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
    patch:
      tags: [Books]
      summary: Update own book listing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    delete:
      tags: [Books]
      summary: Delete or deactivate own book listing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
  /orders:
    get:
      tags: [Orders]
      summary: List orders for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Create an order for a book
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId:
                  type: string
      responses:
        '201':
          description: Order created and payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /verification/request:
    post:
      tags: [Verification]
      summary: Submit or refresh verification request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Verification request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'

  /admin/verifications:
    get:
      tags: [Verification]
      summary: List pending verification requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerificationRequest'

  /admin/verifications/{id}:
    patch:
      tags: [Verification]
      summary: Approve or reject verification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        '200':
          description: Updated verification request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'